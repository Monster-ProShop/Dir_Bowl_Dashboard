<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        :root {
            --primary-blue: #0b3d91;
            --bg-color: #f4f8fa;
            --card-bg: #ffffff;
            --text-main: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 { margin: 0; font-size: 24px; }
        h2 { margin: 5px 0 0 0; font-size: 16px; font-weight: normal; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        /* Tabs Setup */
        .tabs { display: flex; gap: 10px; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-btn {
            background: none; border: none; padding: 10px 20px; font-size: 16px;
            cursor: pointer; color: #666; border-bottom: 3px solid transparent;
        }
        .tab-btn.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
