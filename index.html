<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boardwalk Bowl - Advanced Ops Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary-blue: #0b3d91;
            --secondary-blue: #17a2b8;
            --bg-color: #f4f8fa;
            --card-bg: #ffffff;
            --text-main: #333333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background-color: var(--primary-blue); color: white; padding: 20px; text-align: center; }
        h1 { margin: 0; font-size: 24px; }
        h2 { margin: 5px 0 0 0; font-size: 16px; font-weight: normal; }
        
        .container { max-width: 1300px; margin: 20px auto; padding: 0 20px; }
        
        .tabs { display: flex; gap: 10px; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; color: #666; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-container { width: 100%; height: 350px; }
        
        select, input[type="file"], input[type="date"] { padding: 8px; font-size: 14px; margin: 5px 5px 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: var(--primary-blue); color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 4px; cursor: pointer; margin-top: 10px;}
        button:hover { opacity: 0.9; }
        .btn-export { background-color: #28a745; }
        .btn-import { background-color: #ffc107; color: black; }

        .compare-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; background: #f9f9f9; padding: 10px; border-radius: 6px; border-left: 4px solid var(--primary-blue);}
        .compare-row.disabled { opacity: 0.5; border-left: 4px solid #ccc; }
        
        #summaryOutput { background: #e8f0fe; padding: 15px; border-radius: 4px; margin-top: 15px; border-left: 5px solid var(--primary-blue); }

        /* F&B Insights Styling */
        .fb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; }
        .fb-category-card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; }
        .fb-category-card h4 { margin: 0 0 10px 0; color: var(--primary-blue); border-bottom: 2px solid #ddd; padding-bottom: 5px;}
        .fb-metric { margin-bottom: 8px; font-size: 13px; }
        .fb-metric span { font-weight: bold; float: right; }
        .high-cost { color: #dc3545; }
        .low-cost { color: #28a745; }
        .best-seller { color: #0b3d91; }
        .fb-overall { background: #0b3d91; color: white; padding: 15px; border-radius: 6px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px;}
    </style>
</head>
<body>

    <header>
        <h1>🎳 Boardwalk Bowl - Operations & KPI Command Center</h1>
        <h2>Director of Operations Dashboard</h2>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'dashboardTab')">📊 KPI Dashboard</button>
            <button class="tab-btn" onclick="openTab(event, 'uploadTab')">📂 Data Import & Backup</button>
            <button class="tab-btn" onclick="openTab(event, 'presentationTab')">📑 Presentation Builder</button>
        </div>

        <!-- TAB 1: Dashboard -->
        <div id="dashboardTab" class="tab-content active">
            
            <div class="card">
                <h3 style="margin-top: 0;">Timeframe Comparison Engine</h3>
                <div style="margin-bottom: 15px;">
                    <label><strong>Department:</strong></label>
                    <select id="categorySelect" onchange="renderCharts()">
                        <option value="bowling">Bowling Operations</option>
                        <option value="fb">Coasters Bar & Grill (F&B)</option>
                        <option value="maintenance">Machine & Facility Maintenance</option>
                        <option value="proshop">Front Desk & Pro Shop</option>
                    </select>
                </div>

                <div class="compare-row" id="row1">
                    <strong>Report 1:</strong>
                    <select id="y1" onchange="renderCharts()"><option>2026</option><option>2025</option><option>2024</option></select>
                    <select id="t1" onchange="updatePeriodOptions(1); renderCharts()">
                        <option value="year">Full Year</option><option value="semester">Semester</option>
                        <option value="trimester">Trimester (Quarter)</option><option value="month">Month</option>
                    </select>
                    <select id="v1" onchange="renderCharts()"><option value="all">All Year</option></select>
                </div>

                <div class="compare-row disabled" id="row2">
                    <label><input type="checkbox" id="c2" onchange="toggleRow(2); renderCharts()"> <strong>Compare 2:</strong></label>
                    <select id="y2" onchange="renderCharts()" disabled><option>2025</option><option>2026</option><option>2024</option></select>
                    <select id="t2" onchange="updatePeriodOptions(2); renderCharts()" disabled>
                        <option value="year">Full Year</option><option value="semester">Semester</option>
                        <option value="trimester">Trimester (Quarter)</option><option value="month">Month</option>
                    </select>
                    <select id="v2" onchange="renderCharts()" disabled><option value="all">All Year</option></select>
                </div>
            </div>
            
            <div class="chart-grid">
                <div class="card"><div id="chart1" class="chart-container"></div></div>
                <div class="card"><div id="chart2" class="chart-container"></div></div>
                <div class="card"><div id="chart3" class="chart-container"></div></div>
                <div class="card"><div id="chart4" class="chart-container"></div></div>
            </div>

            <!-- Dynamic Insights Panel (F&B Menu Engineering) -->
            <div id="dynamicInsights" style="display: none;"></div>
        </div>

        <!-- TAB 2: Data Import & Backup -->
        <div id="uploadTab" class="tab-content">
            <div class="card">
                <h3>System Data Management</h3>
                <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
                <h4>Export System Data</h4>
                <button class="btn-export" onclick="exportDataJSON()">📥 Export Backup (.json)</button>
                <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
                <h4>Restore System Data</h4>
                <input type="file" id="jsonFileInput" accept=".json"><br>
                <button class="btn-import" onclick="importDataJSON()">📤 Restore Backup</button>
            </div>
        </div>

        <!-- TAB 3: Presentation Builder -->
        <div id="presentationTab" class="tab-content">
            <div class="card">
                <h3>Executive Presentation Builder</h3>
                <button onclick="generatePresentation()">Generate Executive Summary</button>
                <div id="summaryOutput" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        let globalDB = [];

        // F&B Catalog for Menu Engineering Analysis
        const fbCatalog = {
            "Snacks": [
                { name: "Loaded Nachos", cost: 18.5, sales: 1200 },
                { name: "Pretzel Bites", cost: 12.0, sales: 850 },
                { name: "Mozzarella Sticks", cost: 26.0, sales: 600 },
                { name: "French Fries", cost: 10.5, sales: 1500 }
            ],
            "Food": [
                { name: "Pepperoni Pizza", cost: 22.0, sales: 900 },
                { name: "Boardwalk Burger", cost: 31.0, sales: 750 },
                { name: "Chicken Tenders", cost: 28.5, sales: 1100 },
                { name: "Hot Dog", cost: 19.0, sales: 400 }
            ],
            "N/A Drinks": [
                { name: "Fountain Soda", cost: 8.0, sales: 2500 },
                { name: "Energy Drink", cost: 45.0, sales: 300 },
                { name: "Lemonade", cost: 10.0, sales: 800 },
                { name: "Iced Tea", cost: 6.5, sales: 650 }
            ],
            "Alcohol": [
                { name: "Draft IPA", cost: 18.0, sales: 1800 },
                { name: "House Margarita", cost: 14.0, sales: 950 },
                { name: "Well Whiskey", cost: 11.0, sales: 1200 },
                { name: "Domestic Pitcher", cost: 24.0, sales: 700 }
            ]
        };

        const traceColors = ['#0b3d91', '#28a745', '#fd7e14']; 

        function generate3YearsData() {
            const db = [];
            let currentDate = new Date(2024, 0, 1);
            const endDate = new Date(2026, 11, 31);
            const rand = (min, max) => (Math.random() * (max - min) + min).toFixed(2);

            while (currentDate <= endDate) {
                const month = currentDate.getMonth();
                const isSummer = (month >= 5 && month <= 7) ? 1.2 : 1.0; 
                
                // Lineage & Shoe Revenue generation
                const dailyGames = Math.floor((Math.random() * (1200 - 400) + 400) * isSummer);
                // Simulate variance where sometimes shoes don't match lineage (front desk error/shrinkage)
                const shoeCompliance = (Math.random() * (0.85 - 0.50) + 0.50); 
                const shoeRev = (dailyGames * shoeCompliance * 4.50).toFixed(2); // $4.50 avg shoe rental

                db.push({
                    date: currentDate.toISOString().split('T')[0], year: currentDate.getFullYear(), month: month + 1,
                    
                    lineage: (parseFloat(rand(40, 80)) * isSummer).toFixed(1),
                    totalGames: dailyGames,
                    shoeRevenue: shoeRev,
                    leagueUtil: rand(60, 95),
                    
                    fbRevPerBowler: (parseFloat(rand(10, 20)) * isSummer).toFixed(2),
                    foodCost: rand(22, 30), pourCost: rand(15, 22), barSpendRatio: rand(20, 45),
                    
                    fbs: rand(1500, 3200), resolutionTime: rand(2, 8), downtime: rand(0.5, 3.5), partsCost: rand(5, 15),
                    
                    frontDeskEff: rand(150, 300), bookingConv: rand(25, 55), proShopMargin: rand(45, 65), crossSellRate: rand(10, 30)
                });
                currentDate.setDate(currentDate.getDate() + 1);
            }
            globalDB = db;
        }

        function openTab(evt, tabName) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
            if (tabName === 'dashboardTab') renderCharts();
        }

        function toggleRow(rowNum) {
            const isChecked = document.getElementById(`c${rowNum}`).checked;
            const row = document.getElementById(`row${rowNum}`);
            const els = row.querySelectorAll('select');
            isChecked ? row.classList.remove('disabled') : row.classList.add('disabled');
            els.forEach(el => el.disabled = !isChecked);
        }

        function updatePeriodOptions(rowNum) {
            const type = document.getElementById(`t${rowNum}`).value;
            const valSelect = document.getElementById(`v${rowNum}`);
            valSelect.innerHTML = '';
            if (type === 'year') valSelect.innerHTML = '<option value="all">All Year</option>';
            else if (type === 'semester') valSelect.innerHTML = '<option value="1">H1 (Jan - Jun)</option><option value="2">H2 (Jul - Dec)</option>';
            else if (type === 'trimester') valSelect.innerHTML = '<option value="1">Q1 (Jan-Mar)</option><option value="2">Q2 (Apr-Jun)</option><option value="3">Q3 (Jul-Sep)</option><option value="4">Q4 (Oct-Dec)</option>';
            else if (type === 'month') {
                ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].forEach((m, i) => { valSelect.innerHTML += `<option value="${i+1}">${m}</option>`; });
            }
        }

        function getFilteredData(year, type, val) {
            return globalDB.filter(row => {
                if (row.year != year) return false;
                if (type === 'semester') return (val == 1) ? row.month <= 6 : row.month > 6;
                if (type === 'trimester') return Math.ceil(row.month / 3) == val;
                if (type === 'month') return row.month == val;
                return true;
            });
        }

        function getReportLabel(year, type, val) {
            if (type === 'year') return `${year} Total`;
            if (type === 'semester') return `${year} H${val}`;
            if (type === 'trimester') return `${year} Q${val}`;
            return `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][val-1]} ${year}`;
        }

        function buildFBInsights() {
            let html = `<div class="card"><div class="fb-overall">Coasters Bar & Grill: Menu Engineering & COGS Analysis <br><span style="font-size:14px; font-weight:normal;">Target Overall COGS: 24.5% | Actual Overall COGS: 22.8%</span></div><div class="fb-grid">`;
            
            for (const [category, items] of Object.entries(fbCatalog)) {
                let best = items.reduce((prev, current) => (prev.sales > current.sales) ? prev : current);
                let highestCost = items.reduce((prev, current) => (prev.cost > current.cost) ? prev : current);
                let lowestCost = items.reduce((prev, current) => (prev.cost < current.cost) ? prev : current);

                html += `
                <div class="fb-category-card">
                    <h4>${category}</h4>
                    <div class="fb-metric best-seller">🏆 Best Performer: <span>${best.name}</span></div>
                    <div class="fb-metric high-cost">⚠️ Highest COGS: <span>${highestCost.name} (${highestCost.cost}%)</span></div>
                    <div class="fb-metric low-cost">✅ Lowest COGS: <span>${lowestCost.name} (${lowestCost.cost}%)</span></div>
                </div>`;
            }
            html += `</div></div>`;
            return html;
        }

        function renderCharts() {
            const category = document.getElementById("categorySelect").value;
            const config = { responsive: true, displayModeBar: false };
            const insightsDiv = document.getElementById("dynamicInsights");
            
            const datasets = [];
            [1, 2].forEach((i, index) => {
                const isEnabled = i === 1 || document.getElementById(`c${i}`).checked;
                if (isEnabled) {
                    const y = document.getElementById(`y${i}`).value, t = document.getElementById(`t${i}`).value, v = document.getElementById(`v${i}`).value;
                    const data = getFilteredData(y, t, v);
                    datasets.push({ data, label: getReportLabel(y, t, v), xAxis: Array.from({length: data.length}, (_, idx) => `Day ${idx + 1}`), color: traceColors[index] });
                }
            });

            const buildTraces = (metricKey, chartType = 'scatter') => datasets.map(ds => ({
                x: ds.xAxis, y: ds.data.map(d => parseFloat(d[metricKey])), type: chartType, 
                name: ds.label, line: chartType === 'scatter' ? {color: ds.color, width: 2} : undefined, marker: chartType === 'bar' ? {color: ds.color} : undefined
            }));

            // Hide Insights by Default
            insightsDiv.style.display = "none";

            if (category === "bowling") {
                Plotly.newPlot('chart1', buildTraces('lineage'), { title: 'Lineage per Operational Hour' }, config);
                Plotly.newPlot('chart2', buildTraces('leagueUtil', 'bar'), { title: 'League Utilization %', barmode: 'group' }, config);
                Plotly.newPlot('chart3', buildTraces('avgBowlerSpend'), { title: 'Average Bowler Spend ($)' }, config);
                
                // CHART 4: DUAL AXIS - Lineage vs Shoe Revenue
                const dualTraces = [];
                const ds = datasets[0]; // Only show Report 1 for clarity on dual axis
                dualTraces.push({ x: ds.xAxis, y: ds.data.map(d => d.totalGames), type: 'scatter', name: 'Lineage (Total Games)', line: {color: '#0b3d91'} });
                dualTraces.push({ x: ds.xAxis, y: ds.data.map(d => d.shoeRevenue), type: 'scatter', name: 'Shoe Rev ($)', yaxis: 'y2', line: {color: '#28a745', dash: 'dot'} });
                
                Plotly.newPlot('chart4', dualTraces, { 
                    title: `Audit: Games Bowled vs. Shoe Revenue (${ds.label})`,
                    yaxis: {title: 'Total Games (Cycles)', titlefont: {color: '#0b3d91'}, tickfont: {color: '#0b3d91'}},
                    yaxis2: {title: 'Shoe Revenue ($)', titlefont: {color: '#28a745'}, tickfont: {color: '#28a745'}, overlaying: 'y', side: 'right'}
                }, config);
            } 
            else if (category === "fb") {
                Plotly.newPlot('chart1', buildTraces('fbRevPerBowler', 'bar'), { title: 'F&B Revenue per Bowler ($)', barmode: 'group' }, config);
                Plotly.newPlot('chart2', buildTraces('foodCost'), { title: 'Avg Daily Food Cost %' }, config);
                Plotly.newPlot('chart3', buildTraces('pourCost'), { title: 'Avg Daily Pour Cost %' }, config);
                Plotly.newPlot('chart4', buildTraces('barSpendRatio'), { title: 'Bar Spend Ratio (% of Total Rev)' }, config);
                
                // Show F&B Insights Panel
                insightsDiv.style.display = "block";
                insightsDiv.innerHTML = buildFBInsights();
            }
            else if (category === "maintenance") {
                Plotly.newPlot('chart1', buildTraces('fbs'), { title: 'Frames Between Stops (FBS)' }, config);
                Plotly.newPlot('chart2', buildTraces('resolutionTime', 'bar'), { title: 'Avg Resolution Time (Min)', barmode: 'group' }, config);
                Plotly.newPlot('chart3', buildTraces('downtime'), { title: 'Pinsetter Downtime (%)' }, config);
                Plotly.newPlot('chart4', buildTraces('partsCost'), { title: 'Maintenance Parts Cost per Lane ($)' }, config);
            }
            else if (category === "proshop") {
                Plotly.newPlot('chart1', buildTraces('frontDeskEff'), { title: 'Front Desk Efficiency ($/Hr)' }, config);
                Plotly.newPlot('chart2', buildTraces('bookingConv', 'bar'), { title: 'Event Booking Conversion (%)', barmode: 'group' }, config);
                Plotly.newPlot('chart3', buildTraces('proShopMargin'), { title: 'Pro Shop Gross Margin (%)' }, config);
                Plotly.newPlot('chart4', buildTraces('crossSellRate', 'bar'), { title: 'League Bowler Cross-Sell Rate (%)', barmode: 'group' }, config);
            }
        }

        window.onload = () => { generate3YearsData(); updatePeriodOptions(1); renderCharts(); };
    </script>
</body>
</html>
